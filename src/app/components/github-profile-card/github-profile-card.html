<div class="main" id="contact" appReveal="bottom" [revealDuration]="1000" revealDistance="20px">
  <h1 class="prof-title">Écrivez-moi !</h1>
  <div class="row">
    <div class="main-content-profile">
      <div class="blog-header">
        <p class="subTitle blog-subtitle">{{ contactInfo.subtitle }}</p>
      </div>
      <h2 class="bio-text">"<app-emoji [text]="String(prof().bio)" />"</h2>
      @if (prof().location !== null) {
        <div class="location-div">
          <span class="desc-prof">
            <svg
              viewBox="-0.5 -2 20 19"
              version="1.1"
              width="22"
              height="16"
              aria-hidden="true"
              stroke="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M6 0C2.69 0 0 2.5 0 5.5 0 10.02 6 16 6 16s6-5.98 6-10.5C12 2.5 9.31 0 6 0zm0 14.55C4.14 12.52 1 8.44 1 5.5 1 3.02 3.25 1 6 1c1.34 0 2.61.48 3.56 1.36.92.86 1.44 1.97 1.44 3.14 0 2.94-3.14 7.02-5 9.05zM8 5.5c0 1.11-.89 2-2 2-1.11 0-2-.89-2-2 0-1.11.89-2 2-2 1.11 0 2 .89 2 2z"
              ></path>
            </svg>
            {{ prof().location }}
          </span>
        </div>
      }
      <div class="opp-div">
        <span class="desc-prof">Ouvert aux opportunités : {{ hireable() }}</span>
      </div>
      <app-social-media />
    </div>
    <div class="image-content-profile">
      <img [src]="prof().avatarUrl" [alt]="prof().name" class="profile-image" />
    </div>
  </div>
</div>
