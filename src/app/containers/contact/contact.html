<div
  class="main contact-margin-top"
  id="contact"
  appReveal="bottom"
  [revealDuration]="1000"
  revealDistance="20px"
>
  <div class="contact-header">
    <h1 class="heading contact-title"><app-emoji [text]="contactInfo.title" /></h1>
    <p [class]="theme.isDark() ? 'dark-mode contact-subtitle' : 'subTitle contact-subtitle'">
      {{ contactInfo.subtitle }}
    </p>
  </div>

  <div class="contact-grid">
    <div class="contact-details">
      <h3 class="contact-details-title">Mes coordonnées</h3>

      <ul class="contact-list">
        @if (contactInfo.number) {
          <li class="contact-item">
            <span class="contact-icon" aria-hidden="true"><i class="fas fa-phone-alt"></i></span>
            <span class="contact-item-body">
              <span class="contact-label">Téléphone</span>
              <a class="contact-value" [href]="'tel:' + contactInfo.number">
                {{ contactInfo.number }}
              </a>
            </span>
          </li>
        }

        <li class="contact-item">
          <span class="contact-icon" aria-hidden="true"><i class="fas fa-envelope"></i></span>
          <span class="contact-item-body">
            <span class="contact-label">E-mail</span>
            <a class="contact-value" [href]="'mailto:' + contactInfo.email_address">
              {{ contactInfo.email_address }}
            </a>
          </span>
        </li>

        @if (linkedin) {
          <li class="contact-item">
            <span class="contact-icon contact-icon-linkedin" aria-hidden="true">
              <i class="fab fa-linkedin-in"></i>
            </span>
            <span class="contact-item-body">
              <span class="contact-label">LinkedIn</span>
              <a class="contact-value" [href]="linkedin" target="_blank" rel="noopener noreferrer">
                {{ linkedinLabel }}
              </a>
            </span>
          </li>
        }

        <li class="contact-item">
          <span class="contact-icon" aria-hidden="true">
            <i class="fas fa-map-marker-alt"></i>
          </span>
          <span class="contact-item-body">
            <span class="contact-label">Localisation</span>
            <span class="contact-value">Douala, Cameroun</span>
          </span>
        </li>
      </ul>

      <div class="contact-socials">
        <span class="contact-label">Me suivre</span>
        <app-social-media />
      </div>
    </div>

    <div class="contact-form-card">
      <app-contact-form />
    </div>
  </div>
</div>
